version: 1
environment:
  packages: [python-3.11, python-3.11-dev, py3.11-pip, python-3.12, python-3.12-dev, py3.12-pip, gcc, linux-headers]
checks:
  test:
    description: Unit tests, once for each supported Python. evdev has no wheel and builds from source.
    script: |
      python$PY -m venv /var/tmp/venv
      . /var/tmp/venv/bin/activate
      pip install 'evdev>=1.6' 'Pillow>=10.0' 'pytest>=7.4'
      pip install --no-deps -e .
      pytest -q
    network:
      egress: [pypi.org, files.pythonhosted.org]
    foreach:
      - name: py311
        vars: {PY: "3.11"}
      - name: py312
        vars: {PY: "3.12"}
  build:
    description: The sdist and the wheel build.
    script: |
      python3.12 -m venv /var/tmp/venv
      . /var/tmp/venv/bin/activate
      pip install build
      python -m build --sdist --wheel
    network:
      egress: [pypi.org, files.pythonhosted.org]
